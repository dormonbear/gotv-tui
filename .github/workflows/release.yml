# Push a tag like v0.1.0 (matching package.json "version") to build single-file
# binaries for every platform and publish them as a GitHub release.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          # macOS binaries are built (and ad-hoc signed) on macOS; Apple Silicon refuses unsigned ones
          - { runner: macos-latest, target: bun-darwin-arm64, asset: gotv-tui-darwin-arm64 }
          - { runner: macos-latest, target: bun-darwin-x64, asset: gotv-tui-darwin-x64 }
          - { runner: ubuntu-latest, target: bun-linux-x64, asset: gotv-tui-linux-x64 }
          - { runner: ubuntu-latest, target: bun-linux-arm64, asset: gotv-tui-linux-arm64 }
          - { runner: ubuntu-latest, target: bun-windows-x64, asset: gotv-tui-windows-x64.exe }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test
      - run: bun build --compile --target=${{ matrix.target }} src/main.tsx --outfile dist/${{ matrix.asset }}
      - if: runner.os == 'macOS'
        run: codesign --force --sign - dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
