# Required check for pull requests into main (see branch protection).
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      - run: sh scripts/next-version_test.sh
      - name: cross-compile
        env:
          CGO_ENABLED: '0'
        run: |
          for t in darwin/arm64 linux/amd64 windows/amd64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null .
          done

  # The Windows build is cross-compiled for releases; this runs it for real.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -o gotv-tui.exe .
      - name: smoke
        shell: pwsh
        run: |
          $v = .\gotv-tui.exe --version
          if ($LASTEXITCODE -ne 0 -or -not $v) { throw "--version failed" }
          .\gotv-tui.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "--help failed" }
          .\gotv-tui.exe replay does-not-exist 2>$null
          if ($LASTEXITCODE -ne 1) { throw "replay of a missing dir should exit 1, got $LASTEXITCODE" }
          "ok: $v"
